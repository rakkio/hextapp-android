mutation Login($input: LoginInput!) {
  login(input: $input) {
    token
    user {
      id
      name
      email
      username
      avatar
      favorites
      bookmarks
      downloads {
        app
        downloadedAt
      }
    }
  }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    token
    user {
      id
      name
      email
      username
      avatar
      favorites
      bookmarks
      downloads {
        app
        downloadedAt
      }
    }
  }
}

mutation AddFavorite($itemId: ID!) {
  addFavorite(itemId: $itemId)
}

mutation RemoveFavorite($itemId: ID!) {
  removeFavorite(itemId: $itemId)
}

mutation AddBookmark($itemId: ID!) {
  addBookmark(itemId: $itemId)
}

mutation RemoveBookmark($itemId: ID!) {
  removeBookmark(itemId: $itemId)
}

mutation RegisterDownload($itemId: ID!) {
  registerDownload(itemId: $itemId)
}
